<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Póker">
<title>Club de Póker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Figtree:wght@400;500;700;800&display=swap">
<style>
/* Diseño: casino nocturno — fieltro esmeralda, riel de cuero, acentos dorados. Un solo tema oscuro a propósito. */
:root{
  --bg:#0b1410; --bg2:#0f1d17; --panel:rgba(255,255,255,.05); --line:rgba(232,201,120,.18); --ink:#f3ecd9; --muted:#a9b3a6;
  --gold:#e3b54c; --gold2:#b8862b; --red:#d8443a; --felt:#11643f; --felt2:#0a4229; --rail:#2a1610;
  --display:"Cinzel",Georgia,serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);overflow-x:hidden}
body{color:var(--ink);font:400 15px/1.45 var(--body);
  background:radial-gradient(ellipse at 50% -10%,#1d3a2c 0,transparent 60%),var(--bg);background-attachment:fixed;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.02em}
h2{font-size:18px} h3{font-size:15px;color:var(--gold);margin-top:14px}
.muted{color:var(--muted)} .center{text-align:center} .err{color:#ff8a80;margin:0}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.12em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
.btn{font:700 15px var(--body);border:0;border-radius:11px;min-height:46px;padding:10px 14px;cursor:pointer;color:#10170f;background:#e8e1cd;
  box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#f2cf72,#c99532);color:#2a1b02}
.btn.red{background:linear-gradient(180deg,#e2574d,#a8271f);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;flex:none}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--gold);font:600 13px var(--body);cursor:pointer;padding:4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:600 16px var(--body);color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px;width:100%}
input.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:20px}
.fld{display:flex;flex-direction:column;gap:4px}.fld>span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}.chk input{width:20px;min-height:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Inicio */
.home{display:flex;flex-direction:column;gap:14px}
.hero{text-align:center;padding:18px 6px 6px}
.hero h1{font-size:clamp(34px,10vw,46px);font-weight:900;background:linear-gradient(180deg,#fbe39a,#c99532);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:8px auto 0;max-width:34ch}
.suits{display:flex;justify-content:center;gap:12px;font-size:30px;margin-bottom:6px}.suits .r{color:var(--red)}

/* Lobby */
.lobby{display:flex;flex-direction:column;gap:12px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:900 22px var(--display);color:var(--gold)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font:700 14px var(--body);padding:10px 4px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--gold);border-color:var(--gold)}
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{position:relative;background:linear-gradient(135deg,rgba(17,100,63,.55),rgba(10,66,41,.55));border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tcard.mine{border-color:var(--gold)} .tcard.turn{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(227,181,76,.35)}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.tc-top b{font:700 17px var(--display)}
.tc-mid{font-size:13px;color:#cfe3d4}
.tc-bot{display:flex;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}.dots i.f{background:var(--gold);border-color:var(--gold)}
.tc-turn{position:absolute;right:10px;bottom:10px;background:var(--gold);color:#2a1b02;font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px}
.vbadge{font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#e8e1cd;color:#1b1b1b}
.v-omaha{background:#9fd3ff}.v-short{background:#ffd09f}.v-draw5{background:#d3b7ff}.v-stud7{background:#ffb7c5}
.empty{padding:20px 0}
.board-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:r}
.board-list li{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(0,0,0,.2);border-radius:10px}
.board-list li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.net{font-weight:800;font-variant-numeric:tabular-nums}.net.up{color:#7ee2a0}.net.dn{color:#ff8a80}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:6px}.cdot.off{background:var(--red)}
.mytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.mtab{flex:none;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
.mtab.on{border-color:var(--gold);color:var(--gold)} .mtab.turn{background:var(--gold);color:#2a1b02;animation:blink 1s ease-in-out infinite alternate}
@keyframes blink{to{filter:brightness(1.25)}}

/* Avatar */
.av{--h:200;width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 13px var(--body);color:#fff;position:relative;
  background:radial-gradient(circle at 35% 30%,hsl(var(--h) 70% 62%),hsl(var(--h) 55% 34%));border:2px solid rgba(255,255,255,.85)}
.av.sm{width:26px;height:26px;font-size:11px}
.av s{position:absolute;right:-6px;top:-6px;font-size:11px;text-decoration:none}

/* Cartas */
.cd{--w:40px;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.12);background:linear-gradient(180deg,#fff,#f1ece0);color:#151515;position:relative;display:inline-block;flex:none;
  box-shadow:0 1px 0 #bdb5a2,0 2px 4px rgba(0,0,0,.45);font-family:var(--display);line-height:1;overflow:hidden}
.cd.red{color:#c8231b}
.cd b{position:absolute;left:8%;top:6%;font-size:calc(var(--w)*.34);font-weight:900}
.cd i{position:absolute;left:10%;top:38%;font-size:calc(var(--w)*.26);font-style:normal}
.cd em{position:absolute;right:6%;bottom:2%;font-size:calc(var(--w)*.55);font-style:normal;opacity:.9}
.cd.back{background:repeating-linear-gradient(45deg,#7a1712 0 4px,#a3241c 4px 8px);border:2px solid #f3ecd9}
.cd.slot{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.cd.xs{--w:22px}.cd.xs i{display:none}.cd.xs em{font-size:11px;right:3px;bottom:1px}.cd.xs b{font-size:9px;left:3px;top:2px}
.cd.md{--w:min(10.5vw,42px)} .cd.lg{--w:min(18vw,68px)}
.mycards.n5 .cd.lg{--w:min(15.5vw,58px)} .mycards.n7 .cd.lg{--w:min(11.5vw,46px)}
.mycards{flex-wrap:nowrap}
.cd.hid{background:repeating-linear-gradient(45deg,#7a1712 0 3px,#a3241c 3px 6px);border:1.5px solid #f3ecd9}
.cd.hid b,.cd.hid i,.cd.hid em{display:none}

/* Mesa */
.tablescr{display:flex;flex-direction:column;gap:10px}
.thead{display:flex;align-items:center;gap:8px}.tname{flex:1;min-width:0;text-align:center}
.tname b{display:block;font:700 17px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tname small{color:var(--muted);font-size:12px}
.felt-wrap{position:relative;width:100%;aspect-ratio:3/4;max-height:60vh;margin:4px auto 0;max-width:min(100%,calc(60vh*.75))}
.rail{position:absolute;inset:9% 9%;border-radius:50%;background:linear-gradient(160deg,#4a2a1c,#1d0f0a);padding:3.2%;box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.15)}
.felt{width:100%;height:100%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#1a8a58 0,var(--felt) 45%,var(--felt2) 100%);
  box-shadow:inset 0 0 0 3px rgba(227,181,76,.45),inset 0 0 40px rgba(0,0,0,.55);display:grid;place-items:center}
.logo{font:900 13px var(--display);color:rgba(255,255,255,.12);letter-spacing:.2em;margin-top:52%}
.tcenter{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:56%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;z-index:2}
.pot{font:600 13px var(--body);color:#e8f5ec;background:rgba(0,0,0,.35);padding:3px 12px;border-radius:999px;min-height:22px}
.pot:empty{display:none}.pot b{color:var(--gold);font-variant-numeric:tabular-nums}
.bcards{display:flex;gap:3px;justify-content:center}
.phase{font-size:11px;color:#bfe3cc;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.results{display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.55);border:1px solid var(--gold2);border-radius:10px;padding:6px 10px;font-size:13px}
.results small{display:block;color:var(--gold);font-weight:700}
.waitmsg{color:#d8efe0;font-weight:700;font-size:14px}.waitmsg small{display:block;color:#a9cdb6;font-weight:500;font-size:12px;margin-top:4px}
.seat{position:absolute;transform:translate(-50%,-50%);width:24%;max-width:110px;display:flex;flex-direction:column;align-items:center;z-index:3}
.seat .pod{position:relative;display:flex;align-items:center;gap:5px;background:rgba(10,14,12,.88);border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 3px;width:100%;overflow:hidden}
.pinfo{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.pinfo b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk{font-size:12px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.seat.me .pod{border-color:var(--gold)}
.seat.active .pod{border-color:#fff;box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(227,181,76,.6)}
.seat.out .pod{opacity:.55}.seat.away .pod{opacity:.45}
.seat.win .pod{box-shadow:0 0 0 2px #7ee2a0,0 0 18px rgba(126,226,160,.6)}
.tbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--gold);transform-origin:left;animation:tbar linear forwards}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0);background:var(--red)}}
.scards{display:flex;justify-content:center;margin-bottom:-6px;z-index:1;position:relative}
.scards .cd{margin:0 -3px}.scards.many .cd{margin:0 -6px}
.downs{font-size:10px;font-weight:800;color:#fff;background:rgba(0,0,0,.6);border-radius:6px;padding:0 4px;margin-left:6px;align-self:center}
.bub{margin-top:3px;font-size:11px;font-weight:700;background:rgba(255,255,255,.9);color:#162018;border-radius:8px;padding:1px 7px;max-width:130%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub.w{background:#7ee2a0}
.seat u{position:absolute;top:-4px;right:-2px;text-decoration:none;font-size:9px;font-weight:800;background:#e8e1cd;color:#1b1b1b;border-radius:6px;padding:0 3px}
.seat.empty{width:auto}
.sitbtn{background:rgba(227,181,76,.15);border:1.5px dashed var(--gold);color:var(--gold);font:700 12px var(--body);border-radius:999px;padding:8px 12px;cursor:pointer}
.vac{font-size:11px;color:rgba(255,255,255,.35);border:1px dashed rgba(255,255,255,.2);border-radius:999px;padding:6px 10px}
.chips{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font:800 12px var(--body);color:#fff;background:rgba(0,0,0,.45);border-radius:999px;padding:1px 8px 1px 2px;z-index:2;font-variant-numeric:tabular-nums}
.chips i{width:15px;height:15px;border-radius:50%;background:repeating-conic-gradient(#d8443a 0 30deg,#fff 30deg 45deg);border:2px solid #d8443a}
.dealer{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font:900 12px var(--display);display:grid;place-items:center;box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:2}
.mypanel{display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.45));border:1px solid var(--line);border-radius:16px;padding:12px;
}
.mycards{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.mc{transition:transform .15s;display:inline-block}
.mycards.drawing .mc{cursor:pointer}
.mc.sel{transform:translateY(-12px)}.mc.sel .cd{box-shadow:0 0 0 3px var(--red),0 6px 10px rgba(0,0,0,.5);opacity:.75}
.mc.upc .cd{box-shadow:0 0 0 2px #9fd3ff,0 2px 4px rgba(0,0,0,.45)}
.helper{text-align:center;font:700 14px var(--display);color:var(--gold)}
.acts{display:flex;flex-direction:column;gap:8px}
.abtns{display:flex;gap:8px}.abtns .btn{flex:1;min-width:0}
.rz input{padding:0;min-height:30px;accent-color:var(--gold);background:none;border:0}
.presets{display:flex;gap:6px}.presets button{flex:1;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 2px;font:700 12px var(--body);cursor:pointer}
.seatctl{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.chathead{width:100%;background:none;border:0;color:var(--ink);font:700 14px var(--body);text-align:left;padding:12px 14px;cursor:pointer}
.chat .msgs{padding:0 14px;display:flex;flex-direction:column;gap:3px;font-size:14px;max-height:180px;overflow:auto}
.chat .quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.chat .quick button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chat .row{padding:0 14px 12px}
.loglist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

/* Reglas */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.mbox{background:#121e18;border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column}
.mbox header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.rules{overflow:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));font-size:14px}
.rules p,.rules ul{margin:6px 0}.rules li{margin:3px 0}
.rank{padding-left:20px}.rank li{margin:8px 0}.rank small{display:block;color:var(--muted)}
.ex{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.cform select{appearance:auto}
.small{font-size:12px}
.house{background:rgba(227,181,76,.12);border:1px solid var(--gold2);border-radius:12px;padding:10px 12px;font-size:13px}
.tcard.tour{cursor:default;background:linear-gradient(135deg,rgba(120,72,10,.55),rgba(40,24,6,.6))}
.tcard.tour.run{border-color:var(--gold)}
.regl{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border-radius:999px;padding:2px 9px 2px 2px;font-size:13px;font-weight:700}
.pchip .av{font-style:normal}
.tstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.tstats div{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 2px}
.tstats small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tstats b{font:800 15px var(--body);color:var(--gold);font-variant-numeric:tabular-nums}
.place{color:#ffb4a8;font-weight:800;margin:0}
.podium{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.podium li{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border-radius:10px;padding:5px 10px}
.podium li span{width:30px;text-align:center;font-weight:800}.podium li b{flex:1}
.tbarx{background:linear-gradient(90deg,rgba(120,72,10,.6),rgba(40,24,6,.6));border:1px solid var(--gold2);border-radius:10px;padding:7px 10px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.tbarx b{color:var(--gold)} .tbarx.done{border-color:#7ee2a0}
.bub.pend{background:#7ee2a0;color:#0b2a17}
.addbox{display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px}
.arow{display:flex;align-items:center;gap:6px;font-size:13px}
.arow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arow small{color:var(--gold);font-weight:700}
.arow button{background:rgba(227,181,76,.15);border:1px solid var(--gold2);color:var(--gold);border-radius:8px;padding:5px 8px;font:700 12px var(--body);cursor:pointer}
.addbox select{min-height:36px;font-size:14px;padding:4px 8px}.addbox input{min-height:36px;font-size:14px}
@media (prefers-reduced-motion:reduce){.tbar,.mtab.turn{animation:none}}
@media (max-width:360px){.seat{width:26%}.pinfo b,.stk{font-size:11px}}
</style>

<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================= MOTOR DE PÓKER ================= */
const RANKS='23456789TJQKA', SUITS='shdc';
const HOOK={before:null,after:null};
const VAR={
  holdem:{name:"Texas Hold'em",short:"Hold'em",hole:2,board:true,max:9,limit:'nl',desc:'2 cartas tuyas + 5 comunitarias. La más jugada del mundo.'},
  omaha:{name:'Omaha',short:'Omaha',hole:4,board:true,omaha:true,max:9,limit:'pl',desc:'4 cartas tuyas; usas exactamente 2 de ellas y 3 de la mesa.'},
  short:{name:'Short Deck (6+)',short:'6+',hole:2,board:true,shortDeck:true,max:9,limit:'nl',desc:'Baraja de 36 cartas (sin 2 al 5). El color le gana al full.'},
  draw5:{name:'Póker cerrado',short:'Cerrado',hole:5,draw:true,max:6,limit:'nl',desc:'5 cartas tapadas, una ronda para cambiar cartas y otra de apuestas.'},
  stud7:{name:'Stud de 7 cartas',short:'Stud',stud:true,max:7,limit:'fl',desc:'Sin cartas comunitarias: 3 tapadas y 4 destapadas por jugador.'},
};
const LIMITS={nl:'Sin límite',pl:'Límite al bote',fl:'Límite fijo'};
const LIM_SHORT={nl:'NL',pl:'PL',fl:'FL'};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const r=new Uint32Array(1);crypto.getRandomValues(r);const j=r[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const newDeck=short=>{const d=[];for(const r of RANKS){if(short&&'2345'.includes(r))continue;for(const s of SUITS)d.push(r+s)}return shuffle(d)};
const rv=c=>RANKS.indexOf(c[0]), sv=c=>'cdhs'.indexOf(c[1]);
const inH=s=>!!(s&&s.inHand&&!s.folded);
const canAct=s=>inH(s)&&!s.allin;
const after=(t,from)=>{const n=t.seats.length,r=[];for(let k=1;k<=n;k++)r.push((from+k)%n);return r};

/* ---- evaluación de manos ---- */
const RN1=['Dos','Tres','Cuatro','Cinco','Seis','Siete','Ocho','Nueve','Diez','Jota','Reina','Rey','As'];
const RNP=['Doses','Treses','Cuatros','Cincos','Seises','Sietes','Ochos','Nueves','Dieces','Jotas','Reinas','Reyes','Ases'];
function rank5(cs,short){
  const v=cs.map(rv).sort((a,b)=>b-a), fl=cs.every(c=>c[1]===cs[0][1]);
  const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g=Object.entries(cnt).map(([x,n])=>[n,+x]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const u=[...new Set(v)];let st=-1;
  if(u.length===5){if(u[0]-u[4]===4)st=u[0];else if(!short&&u.join()==='12,3,2,1,0')st=3;else if(short&&u.join()==='12,7,6,5,4')st=7}
  const C=short?{sf:8,q:7,fl:6,fh:5,st:4,t:3,tp:2,p:1,h:0}:{sf:8,q:7,fh:6,fl:5,st:4,t:3,tp:2,p:1,h:0};
  if(st>=0&&fl)return [C.sf,st];
  if(g[0][0]===4)return [C.q,g[0][1],g[1][1]];
  if(g[0][0]===3&&g[1][0]===2)return [C.fh,g[0][1],g[1][1]];
  if(fl)return [C.fl,...v];
  if(st>=0)return [C.st,st];
  if(g[0][0]===3)return [C.t,g[0][1],...g.slice(1).map(x=>x[1])];
  if(g[0][0]===2&&g[1][0]===2)return [C.tp,g[0][1],g[1][1],g[2][1]];
  if(g[0][0]===2)return [C.p,g[0][1],...g.slice(1).map(x=>x[1])];
  return [C.h,...v];
}
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]??-1)-(b[i]??-1);if(d)return d}return 0};
function combos(arr,k){const r=[];const go=(st,acc)=>{if(acc.length===k){r.push(acc.slice());return}for(let i=st;i<arr.length;i++){acc.push(arr[i]);go(i+1,acc);acc.pop()}};go(0,[]);return r}
function handName(sc,short){
  const cat=sc[0], kind=short?['h','p','tp','t','st','fh','fl','q','sf'][cat]:['h','p','tp','t','st','fl','fh','q','sf'][cat];
  switch(kind){
    case 'sf':return sc[1]===12?'Escalera real':'Escalera de color al '+RN1[sc[1]];
    case 'q':return 'Póker de '+RNP[sc[1]];
    case 'fh':return 'Full: '+RNP[sc[1]]+' con '+RNP[sc[2]];
    case 'fl':return 'Color al '+RN1[sc[1]];
    case 'st':return 'Escalera al '+RN1[sc[1]];
    case 't':return 'Trío de '+RNP[sc[1]];
    case 'tp':return 'Doble par: '+RNP[sc[1]]+' y '+RNP[sc[2]];
    case 'p':return 'Par de '+RNP[sc[1]];
    default:return 'Carta alta: '+RN1[sc[1]];
  }
}
/* Mejor mano de 5 según la variante. Devuelve {sc,name} o null si faltan cartas. */
function bestHand(variant,hole,board){
  const V=VAR[variant], short=!!V.shortDeck; hole=(hole||[]).filter(Boolean); board=board||[];
  let best=null;
  const consider=cs=>{const s=rank5(cs,short);if(!best||cmp(s,best)>0)best=s};
  if(V.omaha){if(hole.length<2||board.length<3)return null;for(const h of combos(hole,2))for(const b of combos(board,3))consider([...h,...b])}
  else{const all=[...hole,...board];if(all.length<5)return null;for(const c of combos(all,5))consider(c)}
  return {sc:best,name:handName(best,short)};
}
/* Descripción corta para menos de 5 cartas (antes del flop, etc.) */
function partialName(cards){
  const v=cards.filter(Boolean).map(rv).sort((a,b)=>b-a);if(!v.length)return '';
  const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);const g=Object.entries(cnt).map(([x,n])=>[n,+x]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  if(g[0][0]===4)return 'Póker de '+RNP[g[0][1]];
  if(g[0][0]===3)return 'Trío de '+RNP[g[0][1]];
  if(g[0][0]===2&&g[1]&&g[1][0]===2)return 'Doble par: '+RNP[g[0][1]]+' y '+RNP[g[1][1]];
  if(g[0][0]===2)return 'Par de '+RNP[g[0][1]];
  return 'Carta alta: '+RN1[v[0]];
}
/* Para Stud: fuerza de las cartas destapadas (sólo parejas/tríos/póker y cartas altas) */
function upScore(cards){
  const v=cards.map(rv);const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g=Object.entries(cnt).map(([x,n])=>[n,+x]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const pairs=g.filter(x=>x[0]===2).length;
  const cat=g[0][0]===4?4:g[0][0]===3?3:pairs>=2?2:pairs===1?1:0;
  return [cat,...g.map(x=>x[1])];
}

/* ---- dinámica de una mano ---- */
function seatBlank(pid,stack){return {pid,stack,sitOut:false,leave:false,timeouts:0,inHand:false,folded:false,allin:false,bet:0,total:0,cards:[],up:[],acted:false,canRaise:true,last:'',shown:false,drew:null,win:0,best:null}}
function put(t,s,amt){const x=Math.max(0,Math.min(amt,s.stack));s.stack-=x;s.bet+=x;s.total+=x;if(s.stack===0&&s.inHand)s.allin=true;return x}
function flUnit(t){const h=t.hand,V=VAR[t.variant];
  if(V.stud)return h.street<=4?t.bb:2*t.bb;
  if(V.draw)return h.street===0?t.bb:2*t.bb;
  return h.street<=1?t.bb:2*t.bb}
function potTotal(t){return t.hand.pot+t.seats.reduce((a,s)=>a+(s?s.bet:0),0)}
function legal(t,i){
  const h=t.hand,s=t.seats[i];
  const toCall=Math.max(0,h.curBet-s.bet), allIn=s.bet+s.stack;
  const others=t.seats.some((o,j)=>j!==i&&canAct(o));
  let canRaise=s.canRaise&&others&&allIn>h.curBet, minTo=0, maxTo=0;
  if(t.limit==='fl'){
    const unit=flUnit(t); if(h.raises>=4)canRaise=false;
    minTo=maxTo=Math.min(allIn,h.curBet<unit?unit:h.curBet+unit);
  }else{
    maxTo=allIn;
    if(t.limit==='pl'){const potAfter=potTotal(t)+toCall;maxTo=Math.min(allIn,h.curBet+potAfter)}

    if(allIn<h.curBet+h.minRaise)minTo=maxTo=allIn;

  return {toCall:Math.min(toCall,s.stack),canCheck:toCall===0,canRaise,minTo,maxTo,isBet:h.curBet===0,allIn};
}
function nextToAct(t,from){

  if(acts.length===1){const s=t.seats[acts[0]];if(s.bet>=h.curBet&&(s.acted||t.seats.every((o,j)=>j===acts[0]||!inH(o)||o.allin)))return null}
  for(const j of after(t,from)){const s=t.seats[j];if(canAct(s)&&(!s.acted||s.bet<h.curBet))return j}
  return null;
}
function startHand(t){
  if(HOOK.before)HOOK.before(t);
  if(t.hold)return false;
  const elig=t.seats.map((s,i)=>s&&s.stack>0&&!s.sitOut&&!s.leave?i:-1).filter(i=>i>=0);
  if(elig.length<2){t.hand=null;return false}
  t.handNo++;
  t.btn=t.btn==null||!elig.length?elig[0]:after(t,t.btn).find(i=>elig.includes(i));
  const V=VAR[t.variant];
  t.seats.forEach((s,i)=>{if(!s)return;Object.assign(s,{hs:s.stack,inHand:elig.includes(i),folded:false,allin:false,bet:0,total:0,cards:[],up:[],acted:false,canRaise:true,last:'',shown:false,drew:null,win:0,best:null})});
  const h=t.hand={n:t.handNo,deck:newDeck(V.shortDeck),muck:[],board:[],pot:0,street:0,phase:'bet',curBet:0,minRaise:t.bb,raises:0,toAct:null,actStart:Date.now(),results:null,sbI:null,bbI:null,bringI:null,drawTurn:null,nextAt:null};
  const order=after(t,t.btn).filter(i=>elig.includes(i));
  if(t.ante>0)elig.forEach(i=>{const s=t.seats[i];const x=Math.min(t.ante,s.stack);s.stack-=x;s.total+=x;h.pot+=x;if(!s.stack)s.allin=true});
  let last;
  if(V.stud){
    h.street=3;
    for(let k=0;k<3;k++)order.forEach(i=>{const s=t.seats[i];s.cards.push(h.deck.pop());s.up.push(k===2)});
    let bi=order[0];order.forEach(i=>{const a=t.seats[i].cards[2],b=t.seats[bi].cards[2];if(rv(a)<rv(b)||(rv(a)===rv(b)&&sv(a)<sv(b)))bi=i});
    h.bringI=bi;put(t,t.seats[bi],t.sb);t.seats[bi].last='Abre con '+t.sb;t.seats[bi].acted=true;
    h.curBet=Math.max(...t.seats.map(s=>s?s.bet:0));h.minRaise=Math.max(1,t.bb-h.curBet);h.raises=0;last=bi;
  }else{
    for(let k=0;k<V.hole;k++)order.forEach(i=>t.seats[i].cards.push(h.deck.pop()));
    const sbI=elig.length===2?t.btn:order[0], bbI=after(t,sbI).find(i=>elig.includes(i));
    h.sbI=sbI;h.bbI=bbI;put(t,t.seats[sbI],t.sb);put(t,t.seats[bbI],t.bb);
    h.curBet=Math.max(t.seats[sbI].bet,t.seats[bbI].bet);h.minRaise=t.bb;h.raises=1;last=bbI;
  }

function liveSeats(t){return t.seats.map((s,i)=>inH(s)?i:-1).filter(i=>i>=0)}
function advance(t,lastI){
  const h=t.hand, live=liveSeats(t);
  if(live.length===1)return winUncontested(t,live[0]);
  const nx=nextToAct(t,lastI);
  if(nx!=null){h.toAct=nx;h.actStart=Date.now();return}
  endStreet(t);
}
function isLastStreet(t){const V=VAR[t.variant],h=t.hand;return V.stud?h.street>=7:V.draw?h.street>=1:h.street>=3}
function collectBets(t){const h=t.hand;t.seats.forEach(s=>{if(!s)return;h.pot+=s.bet;s.bet=0;s.acted=false;s.canRaise=true;if(!s.folded&&s.inHand&&!s.allin)s.last=''});h.curBet=0;h.minRaise=t.bb;h.raises=0}
function firstActor(t){
  const V=VAR[t.variant],h=t.hand;
  if(V.stud){let best=null,bi=null;for(const j of after(t,t.btn)){const s=t.seats[j];if(!canAct(s))continue;const sc=upScore(s.cards.filter((c,k)=>s.up[k]));if(!best||cmp(sc,best)>0){best=sc;bi=j}}return bi}

function dealNext(t){
  const V=VAR[t.variant],h=t.hand;
  if(V.stud){h.street++;after(t,t.btn).forEach(j=>{const s=t.seats[j];if(!inH(s))return;s.cards.push(h.deck.pop()||h.muck.pop());s.up.push(h.street<7)});return}
  h.deck.pop();
  if(h.street===0)h.board.push(h.deck.pop(),h.deck.pop(),h.deck.pop());else h.board.push(h.deck.pop());
  h.street++;
}
function endStreet(t){
  const h=t.hand,V=VAR[t.variant];collectBets(t);h.toAct=null;
  const live=liveSeats(t), actors=live.filter(i=>canAct(t.seats[i]));
  if(V.draw&&h.street===0){h.phase='draw';h.drawTurn=after(t,t.btn).find(j=>inH(t.seats[j]));h.actStart=Date.now();return}
  if(isLastStreet(t))return showdown(t);
  if(actors.length<=1){h.phase='runout';h.nextAt=Date.now()+1400;return}
  dealNext(t);h.phase='bet';h.toAct=firstActor(t);h.actStart=Date.now();
  if(h.toAct==null)endStreet(t);

function runoutStep(t){
  const h=t.hand;
  if(isLastStreet(t))return showdown(t);
  dealNext(t);h.nextAt=Date.now()+1400;
  if(isLastStreet(t))h.nextAt=Date.now()+1000;

function doAction(t,i,a,amt){
  const h=t.hand,s=t.seats[i];
  if(!h||h.phase!=='bet'||h.toAct!==i||!s)return false;
  const L=legal(t,i), toCall=h.curBet-s.bet;
  if(a==='fold'){s.folded=true;s.last='Se retira'}
  else if(a==='check'){if(toCall>0)return false;s.last='Pasa'}
  else if(a==='call'){if(toCall<=0)return false;put(t,s,toCall);s.last=s.allin?'All-in':'Iguala '+fmt(s.bet)}
  else if(a==='raise'||a==='allin'){
    let to=a==='allin'?L.allIn:Math.floor(+amt||0);
    if(a==='allin'&&!L.canRaise){if(toCall<=0)return false;put(t,s,toCall);s.last='All-in';s.acted=true;advance(t,i);return true}
    if(!L.canRaise)return false;
    if(t.limit==='fl')to=L.minTo;
    to=Math.min(to,L.maxTo); if(to<L.minTo)return false;
    const was=h.curBet, size=to-was, full=t.limit==='fl'?to>=L.minTo:size>=h.minRaise;
    put(t,s,to-s.bet);
    if(s.bet>was){
      if(full){h.minRaise=Math.max(size,t.bb);h.raises++;t.seats.forEach((o,j)=>{if(j!==i&&canAct(o)){o.acted=false;o.canRaise=true}})}
      else t.seats.forEach((o,j)=>{if(j!==i&&canAct(o)){if(o.acted)o.canRaise=false;o.acted=false}});
      h.curBet=s.bet;
    }
    s.last=s.allin?'All-in '+fmt(s.bet):(was===0?'Apuesta ':'Sube a ')+fmt(s.bet);
  }else return false;

function drawAction(t,i,idx){
  const h=t.hand,s=t.seats[i];
  if(!h||h.phase!=='draw'||h.drawTurn!==i)return false;
  idx=[...new Set((idx||[]).map(Number))].filter(k=>k>=0&&k<5).slice(0,5);
  const old=[];idx.forEach(k=>{if(!h.deck.length)h.deck=shuffle(h.muck.splice(0));old.push(s.cards[k]);s.cards[k]=h.deck.pop()});
  h.muck.push(...old);s.drew=idx.length;s.last=idx.length?'Cambia '+idx.length:'Se queda';
  const nx=after(t,i).find(j=>inH(t.seats[j])&&t.seats[j].drew==null);
  if(nx!=null&&nx!==i){h.drawTurn=nx;h.actStart=Date.now();return true}
  h.drawTurn=null;h.street=1;h.phase='bet';
  t.seats.forEach(o=>{if(o&&inH(o)&&!o.allin)o.last=''});
  const actors=liveSeats(t).filter(j=>canAct(t.seats[j]));
  if(actors.length<=1)return showdown(t),true;
  h.toAct=firstActor(t);h.actStart=Date.now();

function buildPots(t){
  const cs=t.seats.map((s,i)=>s&&s.total>0?{i,tot:s.total,live:inH(s)}:null).filter(Boolean);
  const levels=[...new Set(cs.map(c=>c.tot))].sort((a,b)=>a-b);
  let prev=0;const pots=[];
  for(const L of levels){
    let amt=0;cs.forEach(c=>amt+=Math.max(0,Math.min(c.tot,L)-prev));
    const elig=cs.filter(c=>c.live&&c.tot>=L).map(c=>c.i);
    if(amt>0){
      if(!elig.length){if(pots.length)pots[pots.length-1].amt+=amt;else pots.push({amt,elig:cs.filter(c=>c.live).map(c=>c.i)})}
      else if(pots.length&&pots[pots.length-1].elig.join()===elig.join())pots[pots.length-1].amt+=amt;
      else pots.push({amt,elig});
    }
    prev=L;
  }

function showdown(t){
  const h=t.hand;collectBets(t);h.phase='showdown';h.toAct=null;h.drawTurn=null;
  const live=liveSeats(t);
  live.forEach(i=>{const s=t.seats[i];s.best=VAR[t.variant].board?bestHand(t.variant,s.cards,h.board):bestHand(t.variant,s.cards,[]);s.shown=true;s.last=s.best?s.best.name:''});
  const pots=buildPots(t), res=[], ord=after(t,t.btn);
  pots.forEach((p,k)=>{
    let best=null,w=[];
    p.elig.forEach(i=>{const sc=t.seats[i].best.sc,c=best?cmp(sc,best):1;if(c>0){best=sc;w=[i]}else if(c===0)w.push(i)});
    w.sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
    const share=Math.floor(p.amt/w.length);let odd=p.amt-share*w.length;
    w.forEach(i=>{const x=share+(odd>0?1:0);if(odd>0)odd--;t.seats[i].stack+=x;t.seats[i].win+=x});
    res.push({amt:p.amt,w,name:t.seats[w[0]].best.name,side:k>0,single:p.elig.length===1});
  });
  h.pot=0;h.results=res;h.nextAt=Date.now()+(live.length>1?7000:3500);
  pushLog(t,res.filter(r=>!r.single||res.length===1).map(r=>r.w.map(i=>pname(t.seats[i].pid)).join(' y ')+' gana '+fmt(r.amt)+(r.single?'':' con '+r.name)).join(' · '));

function winUncontested(t,i){
  const h=t.hand;collectBets(t);h.phase='showdown';h.toAct=null;h.drawTurn=null;
  const s=t.seats[i],amt=h.pot;s.stack+=amt;s.win=amt;h.pot=0;
  h.results=[{amt,w:[i],name:null,single:true}];h.nextAt=Date.now()+3000;
  pushLog(t,pname(s.pid)+' gana '+fmt(amt)+' (los demás se retiraron)');

function foldOut(t,i){
  const h=t.hand,s=t.seats[i];
  if(!h||!inH(s)||h.phase==='showdown')return;
  if(h.phase==='bet'&&h.toAct===i)return doAction(t,i,'fold');
  if(h.phase==='draw'&&h.drawTurn===i)drawAction(t,i,[]);
  s.folded=true;s.last='Se retira';
  const live=liveSeats(t);
  if(live.length===1&&h.phase!=='showdown')return winUncontested(t,live[0]);
  if(h.phase==='bet'&&h.toAct!=null){const nx=nextToAct(t,h.toAct-1<0?t.seats.length-1:h.toAct-1);if(nx==null)endStreet(t);else h.toAct=nx}
}
function endHandCleanup(t){
  t.seats.forEach((s,i)=>{
    if(!s)return;
    if(s.pending){s.stack+=s.pending;s.pending=0}
    if(s.leave){const L=t.ledger[s.pid]||(t.ledger[s.pid]={buy:0,out:0});L.out+=s.stack;t.seats[i]=null;return}
    Object.assign(s,{inHand:false,folded:false,allin:false,bet:0,total:0,cards:[],up:[],acted:false,last:'',shown:false,drew:null,win:0,best:null});
  });
  t.hand=null;

function pushLog(t,txt){t.log.push({n:t.handNo,txt});if(t.log.length>30)t.log.shift()}
/* Reloj: llamado por el anfitrión ~3 veces por segundo. Devuelve true si cambió algo. */
function tickTable(t,now,isOn){
  const h=t.hand;
  const elig=t.seats.filter(s=>s&&s.stack>0&&!s.sitOut&&!s.leave).length;
  if(!h){
    if(t.hold){if(t.waitUntil){t.waitUntil=null;return true}return false}
    if(elig>=2&&!t.waitUntil){t.waitUntil=now+2500;return true}
    if(elig<2&&t.waitUntil){t.waitUntil=null;return true}
    if(t.waitUntil&&now>=t.waitUntil){t.waitUntil=null;startHand(t);return true}
    return false;
  }
  if(h.phase==='showdown'){if(now>=h.nextAt){endHandCleanup(t);if(!t.hold&&t.seats.filter(s=>s&&s.stack>0&&!s.sitOut&&!s.leave).length>=2)startHand(t);return true}return false}
  if(h.phase==='runout'){if(now>=h.nextAt){runoutStep(t);return true}return false}
  const i=h.phase==='bet'?h.toAct:h.drawTurn; if(i==null)return false;
  const s=t.seats[i], el=now-h.actStart;
  const away=s.sitOut||s.leave||!isOn(s.pid);
  const limitMs=away?(s.sitOut||s.leave?600:Math.max(25000,(t.timer||0)*1000)):(t.timer?t.timer*1000:0);
  if(limitMs&&el>limitMs){
    if(!away){s.timeouts=(s.timeouts||0)+1;if(s.timeouts>=2)s.sitOut=true}
    if(h.phase==='draw')drawAction(t,i,[]);
    else doAction(t,i,h.curBet>s.bet?'fold':'check');
    return true;
  }
  return false;
}

/* ================= CLUB, CONEXIÓN Y PANTALLAS ================= */
const PREFIX='pokerclub-kv-', ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', MAX_CLUB=40, MAX_TABLES=12;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(+n||0).toLocaleString('es-MX');
const clean=(s,n=14)=>String(s||'').replace(/[<>&"]/g,'').replace(/\s+/g,' ').trim().slice(0,n);
const view=$('app');

let C=null;            // estado completo del club (sólo el anfitrión)
let V=null;            // lo que ve este celular
let me=null, isHost=false, code=null, peer=null, conn=null, conns={}, connected=false, errMsg='', clockOff=0, retryT=null, leaving=false;
let ui={screen:'lobby',tid:null,raise:null,drawSel:new Set(),rules:false,create:false,chat:'',chatOpen:false,tab:'mesas',addOpen:false,admin:false,tcreate:false};
let houseMode=false, lastMsgAt=0, hiddenAt=0;
let myName='';try{myName=localStorage.getItem('pk_name')||''}catch(e){}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const pname=pid=>(C&&C.players[pid]&&C.players[pid].name)||(V&&V.players[pid]&&V.players[pid].name)||'Jugador';
const isOnline=pid=>!!(C&&C.players[pid]&&C.players[pid].online);
const newCode=()=>{let s='';const a=new Uint32Array(4);crypto.getRandomValues(a);for(const n of a)s+=ALPH[n%ALPH.length];return s};
const shareUrl=c=>location.origin+location.pathname+'?club='+c;

/* ---------- Anfitrión ---------- */
function newClub(){return {v:0,code,pn:0,tn:0,trn:0,players:{p0:{name:houseMode?'Mesa':(myName||'Anfitrión'),online:true,tok:'',house:houseMode}},tables:[],tours:[]}}
function hostClub(resume){
  if(typeof Peer==='undefined'){errMsg='No se pudo cargar la conexión. Revisa tu internet.';return renderHome()}
  isHost=true;me='p0';conns={};
  if(resume){C=resume.C;code=C.code;C.tours=C.tours||[];C.trn=C.trn||0;Object.values(C.players).forEach(p=>p.online=false);C.players.p0.online=true;
    if(!C.players.p0.house)C.players.p0.name=myName||C.players.p0.name;
    const away=Date.now()-(resume.at||Date.now());shiftClocks(away)}
  else{code=newCode();C=newClub()}
  try{history.replaceState(null,'',location.pathname+'?club='+code)}catch(_){}
  renderMsg(resume?'Reabriendo el club '+code+'…':'Creando el club…');
  hostOpen(!!resume,0);
}
function hostOpen(resume,tries){
  const old=peer;peer=null;if(old){old.__dead=true;try{old.destroy()}catch(_){}}
  const pp=new Peer(PREFIX+code);peer=pp;
  pp.on('open',()=>{if(pp!==peer)return;connected=true;startTicker();commit()});
  pp.on('error',e=>{if(pp!==peer)return;
    if(e.type==='unavailable-id'){
      if(resume||C.v>0){if(tries<20){if(!V)renderMsg('Recuperando el código '+code+'… ('+(tries+1)+')');return setTimeout(()=>hostOpen(true,tries+1),3000)}}
      else{code=newCode();C.code=code;return hostOpen(false,0)}
    }
    if(!connected&&!V){errMsg='No se pudo abrir el club ('+e.type+').';resetAll()}
  });
  pp.on('disconnected',()=>{setTimeout(()=>{try{if(pp===peer&&pp.disconnected&&!pp.destroyed)pp.reconnect()}catch(_){}},800)});
  pp.on('close',()=>{if(pp===peer&&!pp.__dead&&isHost&&C&&!leaving)setTimeout(()=>{if(pp===peer)hostOpen(true,0)},1500)});
  pp.on('connection',c=>{
    c.lastSeen=Date.now();
    c.on('data',m=>{c.lastSeen=Date.now();hostMsg(c,m)});
    c.on('close',()=>dropConn(c));
    c.on('error',()=>{});
  });
}
function dropConn(c){if(c.pid&&conns[c.pid]===c){delete conns[c.pid];if(C.players[c.pid])C.players[c.pid].online=false;commit()}}
function shiftClocks(ms){
  if(!C||ms<1500)return;
  C.tables.forEach(t=>{const h=t.hand;if(h){h.actStart+=ms;if(h.nextAt)h.nextAt+=ms}if(t.waitUntil)t.waitUntil+=ms});
  (C.tours||[]).forEach(T=>{if(T.status==='run'&&!T.paused)T.levelStart+=ms});
}
function hostMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='hi'){
    let id=m.id&&C.players[m.id]&&C.players[m.id].tok&&C.players[m.id].tok===m.tok?m.id:null;
    if(!id){
      if(Object.keys(C.players).length>=MAX_CLUB){try{c.send({t:'full'})}catch(_){}return setTimeout(()=>c.close(),300)}
      id='p'+(++C.pn);C.players[id]={name:'',tok:Math.random().toString(36).slice(2)+Date.now().toString(36)};
    }
    if(conns[id]&&conns[id]!==c){try{conns[id].close()}catch(_){}}
    c.pid=id;conns[id]=c;const P=C.players[id];P.online=true;P.name=clean(m.name)||P.name||'Jugador '+id.slice(1);
    try{c.send({t:'hello',id,tok:P.tok})}catch(_){}
    return commit();
  }
  if(m.t==='ping'){try{c.send({t:'pong'})}catch(_){}return}
  if(m.t==='do'&&c.pid)handle(c.pid,m.a||{});
}
let saveT=0;
function commit(){
  C.v++;
  for(const [pid,c] of Object.entries(conns)){try{c.open&&c.send({t:'state',S:viewFor(pid)})}catch(_){}}
  V=viewFor('p0');clockOff=0;
  const now=Date.now();if(now-saveT>1500){saveT=now;store.set('pk_host',{at:now,C})}
  render();
}
function viewFor(pid){
  const S=JSON.parse(JSON.stringify(C));
  Object.values(S.players).forEach(p=>delete p.tok);
  S.tables.forEach(t=>{if(t.hand){delete t.hand.deck;delete t.hand.muck}
    t.seats.forEach(s=>{if(s&&s.pid!==pid&&!s.shown)s.cards=s.cards.map((c,k)=>s.up[k]?c:null)})});
  S.now=Date.now();S.you=pid;return S;
}
let tickIv=null;
function startTicker(){
  if(tickIv)return;
  let lastBeat=0;
  tickIv=setInterval(()=>{if(!C)return;const now=Date.now();let ch=false;
    if(now-lastBeat>3000){lastBeat=now;Object.values(conns).forEach(c=>{if(now-(c.lastSeen||0)>16000){try{c.close()}catch(_){}dropConn(c)}})}
    (C.tours||[]).forEach(T=>{if(tourTick(T,now))ch=true});
    [...C.tables].forEach(t=>{try{if(tickTable(t,now,pid=>pid==='p0'||isOnline(pid)))ch=true}catch(e){console.error(e)}});
    if(ch)commit();},350);
}
function seatOf(t,pid){return t.seats.findIndex(s=>s&&s.pid===pid)}
function handle(pid,a){
  const P=C.players[pid];if(!P)return;
  const t=a.tid!=null?C.tables.find(x=>x.id===a.tid):null;
  switch(a.k){
    case 'name':P.name=clean(a.name)||P.name;break;
    case 'mk':{
      if(C.tables.length>=MAX_TABLES)return;
      const v=VAR[a.variant]?a.variant:'holdem', lim=LIMITS[a.limit]?a.limit:VAR[v].limit;
      const bb=[2,10,20,50,100,200,500,1000].includes(+a.bb)?+a.bb:20, buy=Math.max(10,Math.min(500,+a.buyBB||100))*bb;
      const max=Math.max(2,Math.min(VAR[v].max,+a.max||VAR[v].max));
      C.tables.push({id:++C.tn,name:clean(a.name,22)||('Mesa '+(C.tn)),variant:v,limit:lim,sb:Math.max(1,Math.floor(bb/2)),bb,
        ante:+a.ante>0?Math.max(1,Math.round(bb*(+a.ante)/100)):(v==='stud7'?Math.max(1,Math.round(bb/5)):0),
        buyin:buy,timer:[0,20,30,45,60].includes(+a.timer)?+a.timer:30,rebuy:a.rebuy!==false,
        seats:Array(max).fill(null),ledger:{},btn:null,handNo:0,log:[],chat:[],hand:null,by:pid,waitUntil:null});
      break;}
    case 'close':if(t&&(t.by===pid||pid==='p0')&&t.seats.every(s=>!s))C.tables=C.tables.filter(x=>x!==t);break;
    case 'sit':{if(!t||t.tour||P.house||seatOf(t,pid)>=0)return;const i=a.s|0;if(i<0||i>=t.seats.length||t.seats[i])return;
      t.seats[i]=seatBlank(pid,t.buyin);const L=t.ledger[pid]||(t.ledger[pid]={buy:0,out:0});L.buy+=t.buyin;break;}
    case 'leave':{if(!t)return;const i=seatOf(t,pid);if(i<0)return;const s=t.seats[i];
      if(t.tour){s.sitOut=true;break}
      if(t.hand&&inH(s)&&t.hand.phase!=='showdown'){s.leave=true;foldOut(t,i)}
      else if(t.hand&&t.hand.phase==='showdown'&&s.inHand){s.leave=true}
      else{t.ledger[pid].out+=s.stack;t.seats[i]=null}
      break;}
    case 'sitout':{if(!t)return;const s=t.seats[seatOf(t,pid)];if(!s)return;s.sitOut=!s.sitOut;s.timeouts=0;break;}
    case 'rebuy':{if(!t||!t.rebuy||t.tour)return;const s=t.seats[seatOf(t,pid)];if(!s||s.stack>0||inH(s))return;s.stack=t.buyin;s.sitOut=false;t.ledger[pid].buy+=t.buyin;break;}
    case 'add':{
      if(!t)return;const target=a.to||pid, i=seatOf(t,target);if(i<0)return;const s=t.seats[i];
      const admin=pid==='p0'||t.by===pid||(t.tour&&(C.tours.find(T=>T.id===t.tour)||{}).by===pid);
      if(!admin&&(target!==pid||!t.rebuy||t.tour))return;
      const amt=Math.floor(+a.amt||0);if(!(amt>0&&amt<=1e8))return;
      if(t.hand&&inH(s)&&t.hand.phase!=='showdown')s.pending=(s.pending||0)+amt;else s.stack+=amt;
      s.sitOut=false;s.timeouts=0;const L=t.ledger[target]||(t.ledger[target]={buy:0,out:0});L.buy+=amt;
      pushLog(t,(target===pid?pname(pid)+' agregó ':pname(pid)+' le dio ')+fmt(amt)+' fichas'+(target===pid?'':' a '+pname(target))+(s.pending?' (al terminar la mano)':''));
      break;}
    case 'tmk':{
      if((C.tours||[]).filter(T=>T.status!=='done').length>=4)return;
      const v=VAR[a.variant]?a.variant:'holdem';
      const T={id:++C.trn,name:clean(a.name,22)||('Torneo '+C.trn),variant:v,limit:LIMITS[a.limit]?a.limit:VAR[v].limit,
        stack:[1500,3000,5000,10000].includes(+a.stack)?+a.stack:3000,levelMin:[3,5,8,10,15,20].includes(+a.levelMin)?+a.levelMin:10,
        timer:[0,20,30,45,60].includes(+a.timer)?+a.timer:30,rebuyLv:[0,2,4].includes(+a.rebuyLv)?+a.rebuyLv:0,
        seats:Math.max(2,Math.min(VAR[v].max,+a.seats||VAR[v].max)),ante:!!a.ante,by:pid,status:'reg',reg:[],tables:[],places:[],level:0,levelStart:0,paused:false,pausedAt:0,entries:{},total:0,startedAt:0};
      if(!P.house)T.reg.push(pid);
      C.tours.push(T);break;}
    case 'treg':{const T=C.tours.find(x=>x.id===a.trid);if(!T||T.status!=='reg'||P.house)return;
      if(T.reg.includes(pid))T.reg=T.reg.filter(x=>x!==pid);else{if(T.reg.length>=MAX_CLUB)return;T.reg.push(pid)}break;}
    case 'tcancel':{const T=C.tours.find(x=>x.id===a.trid);if(!T||T.status!=='reg'||(T.by!==pid&&pid!=='p0'))return;C.tours=C.tours.filter(x=>x!==T);break;}
    case 'tstart':{const T=C.tours.find(x=>x.id===a.trid);if(!T||T.status!=='reg'||(T.by!==pid&&pid!=='p0')||T.reg.length<2)return;tourStart(T);break;}
    case 'tpause':{const T=C.tours.find(x=>x.id===a.trid);if(!T||T.status!=='run'||(T.by!==pid&&pid!=='p0'))return;
      const now=Date.now();if(T.paused){T.levelStart+=now-T.pausedAt;T.paused=false}else{T.paused=true;T.pausedAt=now}
      tourTables(T).forEach(x=>{x.hold=T.paused;pushLog(x,T.paused?'⏸ Torneo en pausa (se termina la mano en curso)':'▶️ Se reanuda el torneo')});break;}
    case 'trebuy':{if(!t||!t.tour)return;const T=C.tours.find(x=>x.id===t.tour);const s=t.seats[seatOf(t,pid)];
      if(!T||!s||s.stack>0||inH(s)||T.level>=T.rebuyLv)return;s.stack=T.stack;s.sitOut=false;T.entries[pid]=(T.entries[pid]||1)+1;T.total++;
      pushLog(t,pname(pid)+' recompró '+fmt(T.stack));break;}
    case 'tclear':{const T=C.tours.find(x=>x.id===a.trid);if(!T||T.status!=='done'||(T.by!==pid&&pid!=='p0'))return;
      tourTables(T).forEach(x=>{C.tables=C.tables.filter(y=>y!==x)});C.tours=C.tours.filter(x=>x!==T);break;}
    case 'act':{if(!t)return;const i=seatOf(t,pid);if(i<0)return;t.seats[i].timeouts=0;if(!doAction(t,i,a.a,a.to))return;break;}
    case 'draw':{if(!t)return;const i=seatOf(t,pid);if(i<0)return;t.seats[i].timeouts=0;if(!drawAction(t,i,a.idx))return;break;}
    case 'chat':{if(!t)return;const txt=clean(a.txt,140);if(!txt)return;t.chat.push({pid,txt,at:Date.now()});if(t.chat.length>40)t.chat.shift();break;}
    default:return;
  }
  commit();
}


/* ---------- Torneos (anfitrión) ---------- */
const LV_MULT=[1,1.5,2,3,4,5,6,8,10,12,15,20,25,30,40,50,60,80,100,120,150,200,250,300,400,500];
const nice=x=>{if(x<10)return Math.max(2,Math.round(x/2)*2);const p=Math.pow(10,Math.floor(Math.log10(x)))/2;return Math.round(x/p)*p};
function tourBlinds(T,lv){const bb0=T.stack/100,bb=nice(bb0*LV_MULT[Math.min(lv,LV_MULT.length-1)]);const st=T.variant==='stud7';
  return {bb,sb:Math.max(1,Math.floor(bb/2)),ante:st?Math.max(1,Math.round(bb/5)):(T.ante&&lv>=3?Math.max(1,Math.round(bb/10)):0)}}
const tourTables=T=>C.tables.filter(x=>x.tour===T.id);
const tourAlive=T=>{const r=[];tourTables(T).forEach(x=>x.seats.forEach(s=>{if(s)r.push(s)}));return r};
function tourStart(T){
  const ps=shuffle(T.reg.filter(pid=>C.players[pid])), n=ps.length, k=Math.ceil(n/T.seats), now=Date.now();
  T.status='run';T.level=0;T.levelStart=now;T.startedAt=now;T.total=n;T.places=[];T.tables=[];
  const b=tourBlinds(T,0);
  for(let j=0;j<k;j++){
    const t={id:++C.tn,name:T.name+(k>1?' · Mesa '+(j+1):''),variant:T.variant,limit:T.limit,sb:b.sb,bb:b.bb,ante:b.ante,buyin:T.stack,timer:T.timer,rebuy:false,
      seats:Array(T.seats).fill(null),ledger:{},btn:null,handNo:0,log:[],chat:[],hand:null,by:T.by,waitUntil:null,tour:T.id,hold:false};
    C.tables.push(t);T.tables.push(t.id);
  }
  const tabs=tourTables(T);
  ps.forEach((pid,i)=>{const t=tabs[i%k];const free=t.seats.map((x,q)=>x?-1:q).filter(q=>q>=0);const q=free[Math.floor(Math.random()*free.length)];
    t.seats[q]=seatBlank(pid,T.stack);T.entries[pid]=1});
  tabs.forEach(t=>pushLog(t,'🏆 ¡Empieza el torneo! Ciegas '+fmt(b.sb)+'/'+fmt(b.bb)));
}
function tourTick(T,now){
  if(T.status!=='run')return false;
  const sig=()=>T.places.length+':'+T.status+':'+tourTables(T).map(x=>x.id+'-'+x.seats.filter(Boolean).length).join(',');
  const before=sig();tourTables(T).forEach(x=>{if(!x.hand)HOOK.after(x)});if(sig()!==before)return true;
  if(T.paused)return false;
  if(now>=T.levelStart+T.levelMin*60000){T.level++;T.levelStart+=T.levelMin*60000;const b=tourBlinds(T,T.level);
    tourTables(T).forEach(t=>pushLog(t,'⬆️ Nivel '+(T.level+1)+': ciegas '+fmt(b.sb)+'/'+fmt(b.bb)+(b.ante?' · ante '+fmt(b.ante):'')+(T.rebuyLv&&T.level===T.rebuyLv?' · se acabaron las recompras':'')));return true}
  return false;
}
HOOK.before=t=>{
  if(!t.tour||!C)return;const T=C.tours.find(x=>x.id===t.tour);if(!T)return;
  const b=tourBlinds(T,T.level);t.sb=b.sb;t.bb=b.bb;t.ante=b.ante;t.hold=T.paused||T.status!=='run';
};
HOOK.after=t=>{
  if(!t.tour||!C)return;const T=C.tours.find(x=>x.id===t.tour);if(!T||T.status!=='run')return;
  // eliminados
  const canRebuy=T.level<T.rebuyLv;
  const busted=t.seats.map((s,i)=>s&&s.stack<=0&&!(s.pending>0)?i:-1).filter(i=>i>=0);
  if(busted.length&&!canRebuy){
    const ord=busted.sort((a,b)=>(t.seats[b].hs||0)-(t.seats[a].hs||0));
    const aliveAfter=tourAlive(T).length-busted.length;
    ord.forEach((i,k)=>{const pid=t.seats[i].pid;T.places.push({pid,place:aliveAfter+k+1});pushLog(t,'💀 '+pname(pid)+' queda en el lugar #'+(aliveAfter+k+1));t.seats[i]=null});
  }
  const alive=tourAlive(T);
  if(alive.length<=1){
    if(alive.length===1)T.places.push({pid:alive[0].pid,place:1});
    T.status='done';T.endedAt=Date.now();tourTables(T).forEach(x=>{x.hold=true});
    pushLog(t,'🏆 ¡'+(alive[0]?pname(alive[0].pid):'—')+' gana el torneo!');return;
  }
  tourBalance(T,t);
};
function tourBalance(T,t){
  const tabs=tourTables(T);if(tabs.length<2||!C.tables.includes(t))return;
  const cnt=x=>x.seats.filter(Boolean).length, A=tourAlive(T).length, need=Math.ceil(A/T.seats);
  const others=tabs.filter(x=>x!==t);
  const placeIn=(seat,to)=>{const free=to.seats.map((x,q)=>x?-1:q).filter(q=>q>=0);if(!free.length)return false;
    Object.assign(seat,{inHand:false,folded:false,allin:false,bet:0,total:0,cards:[],up:[],acted:false,last:'',shown:false,drew:null,win:0,best:null});
    to.seats[free[Math.floor(Math.random()*free.length)]]=seat;pushLog(to,'➡️ '+pname(seat.pid)+' llega a esta mesa');return true};
  if(tabs.length>need&&cnt(t)<=Math.min(...others.map(cnt))){
    t.seats.forEach((seat,i)=>{if(!seat)return;const to=others.slice().sort((a,b)=>cnt(a)-cnt(b))[0];if(placeIn(seat,to))t.seats[i]=null});
    if(t.seats.every(x=>!x)){C.tables=C.tables.filter(x=>x!==t);T.tables=T.tables.filter(id=>id!==t.id)}
    return;
  }
  const minO=others.slice().sort((a,b)=>cnt(a)-cnt(b))[0];
  if(cnt(t)-cnt(minO)>=2){
    const cand=t.seats.map((x,i)=>x&&i!==t.btn?i:-1).filter(i=>i>=0);const i=cand[Math.floor(Math.random()*cand.length)];
    const sp=i!=null?t.seats[i]:null;if(sp&&placeIn(sp,minO)){pushLog(t,'⬅️ '+pname(sp.pid)+' se cambia de mesa para equilibrar');t.seats[i]=null}
  }
}

/* ---------- Invitado ---------- */
function joinClub(raw){
  const c=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==4){errMsg='Escribe el código de 4 letras del club.';return renderHome()}
  if(typeof Peer==='undefined'){errMsg='No se pudo cargar la conexión. Revisa tu internet.';return renderHome()}
  try{conn&&conn.close()}catch(_){} try{peer&&peer.destroy()}catch(_){}
  code=c;isHost=false;errMsg='';leaving=false;
  if(!V)renderMsg('Entrando al club '+c+'…');
  peer=new Peer();
  peer.on('open',()=>{
    const cn=peer.connect(PREFIX+c,{reliable:true});conn=cn;
    cn.on('open',()=>{connected=true;lastMsgAt=Date.now();const saved=store.get('pk_me_'+c)||{};try{cn.send({t:'hi',name:myName,id:saved.id,tok:saved.tok})}catch(_){}
      try{history.replaceState(null,'',location.pathname+'?club='+c)}catch(_){}});
    cn.on('data',m=>{
      lastMsgAt=Date.now();
      if(!m||typeof m!=='object'||m.t==='pong')return;
      if(m.t==='full'){errMsg='El club está lleno.';return resetAll()}
      if(m.t==='hello'){me=m.id;store.set('pk_me_'+c,{id:m.id,tok:m.tok});return}
      if(m.t==='state'&&m.S){V=m.S;clockOff=Date.now()-V.now;me=V.you;render()}
    });
    cn.on('close',()=>{if(conn!==cn)return;connected=false;render();if(!leaving)retry()});
    cn.on('error',()=>{});
    setTimeout(()=>{if(!connected&&!V&&!leaving){errMsg='No se encontró el club '+c+'. Revisa el código o que el anfitrión tenga la app abierta.';resetAll()}},12000);
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){if(V){connected=false;render();return retry()}errMsg='No existe el club '+c+'.';return resetAll()}
    if(!connected&&!V){errMsg='No se pudo conectar ('+e.type+').';resetAll()}
  });
}
setInterval(()=>{
  if(isHost||!code||leaving)return;
  if(conn&&conn.open){try{conn.send({t:'ping'})}catch(_){}}
  if(connected&&Date.now()-lastMsgAt>13000){connected=false;render();try{conn&&conn.close()}catch(_){}joinClub(code)}
},4000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();if(isHost&&C)store.set('pk_host',{at:Date.now(),C});return}
  const away=hiddenAt?Date.now()-hiddenAt:0;hiddenAt=0;
  if(isHost&&C){shiftClocks(away);if(!peer||peer.destroyed)hostOpen(true,0);else if(peer.disconnected){try{peer.reconnect()}catch(_){}}
    Object.values(conns).forEach(c=>{c.lastSeen=Date.now()});commit();return}
  if(code&&!leaving&&(!conn||!conn.open||Date.now()-lastMsgAt>6000)){connected=false;joinClub(code)}
});

const mmss=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s2=Math.floor(ms/1000)%60;return m+':'+String(s2).padStart(2,'0')};
const tBlindsTxt=(T,lv)=>{const b=tourBlinds(T,lv);return fmt(b.sb)+'/'+fmt(b.bb)+(b.ante?' · ante '+fmt(b.ante):'')};

function levelLeft(T){const now=Date.now()-clockOff;return T.paused?T.levelStart+T.levelMin*60000-T.pausedAt:T.levelStart+T.levelMin*60000-now}
function tourCard(T){

    return `<article class="tcard tour">${head}
      <div class="regl">${T.reg.map(pid=>`<span class="pchip"><i class="av sm" style="--h:${hue(pid)}">${esc(initials(V.players[pid]?.name))}</i>${esc(V.players[pid]?.name||'?')}</span>`).join('')||'<span class="muted">Nadie inscrito aún</span>'}</div>

        ${admin?`<button class="btn sm ghost" data-a="tpause" data-tr="${T.id}">${T.paused?'▶️ Reanudar':'⏸ Pausar'}</button>`:''}</div></article>`;

    ${admin?`<button class="link" data-a="tclear" data-tr="${T.id}">Quitar torneo de la lista</button>`:''}</article>`;
}

const SUITC={s:'♠',h:'♥',d:'♦',c:'♣'};
const cardH=(c,cls='')=>c?`<span class="cd ${cls}${'hd'.includes(c[1])?' red':''}"><b>${c[0]==='T'?'10':c[0]}</b><i>${SUITC[c[1]]}</i><em>${SUITC[c[1]]}</em></span>`:`<span class="cd back ${cls}"></span>`;

function renderTable(){
  document.documentElement.dataset.scr='table';
  const t=V.tables.find(x=>x.id===ui.tid), h=t.hand, N=t.seats.length, myI=t.seats.findIndex(s=>s&&s.pid===me), mySeat=myI>=0?t.seats[myI]:null;
  const base=myI>=0?myI:0, Vv=VAR[t.variant];
  const ang=i=>(90+360*((i-base+N)%N)/N)*Math.PI/180;
  const now=Date.now()-clockOff;
  let seatsH='', betsH='';
  t.seats.forEach((s,i)=>{
    const a=ang(i), x=50+38.5*Math.cos(a), y=50+44*Math.sin(a);
    if(!s){
      seatsH+=`<div class="seat empty" style="left:${x}%;top:${y}%">${myI<0&&!t.tour&&!(V.players[me]&&V.players[me].house)?`<button class="sitbtn" data-a="sit" data-s="${i}">Sentarme</button>`:'<span class="vac">Vacío</span>'}</div>`;return;
    }
    const P=V.players[s.pid]||{name:'?'}, active=h&&((h.phase==='bet'&&h.toAct===i)||(h.phase==='draw'&&h.drawTurn===i));
    const isW=h&&h.results&&h.results.some(r=>r.w.includes(i));
    let cards='';
    if(s.cards&&s.cards.length&&s.pid!==me){
      if(Vv.stud&&!s.shown)cards=s.cards.map((c,k)=>s.up[k]?cardH(c,'xs'):'').join('')+`<span class="downs">${s.cards.filter((c,k)=>!s.up[k]).length}▼</span>`;
      else cards=s.cards.map(c=>cardH(c,'xs'+(s.shown?'':' hid'))).join('');
    }
    let timer='';
    if(active&&t.timer){const el=Math.max(0,(now-h.actStart)/1000),tot=t.timer;timer=`<i class="tbar" style="animation-duration:${tot}s;animation-delay:-${Math.min(el,tot)}s"></i>`}
    const tag=h&&h.sbI===i&&h.phase!=='showdown'&&h.street===0&&!Vv.stud?'<u>CP</u>':h&&h.bbI===i&&h.street===0&&h.phase!=='showdown'&&!Vv.stud?'<u>CG</u>':'';
    seatsH+=`<div class="seat${s.pid===me?' me':''}${active?' active':''}${s.folded||!s.inHand?' out':''}${isW?' win':''}${s.sitOut?' away':''}" style="left:${x}%;top:${y}%">
      ${cards?`<div class="scards${s.cards.length>3?' many':''}">${cards}</div>`:''}
      <div class="pod"><span class="av" style="--h:${hue(s.pid)}">${esc(initials(P.name))}${P.online===false?'<s>⚡</s>':''}</span>
        <div class="pinfo"><b>${esc(P.name)}</b><span class="stk">${s.allin&&!s.stack?'ALL-IN':fmt(s.stack)}</span></div>${timer}</div>
      ${s.pending?`<div class="bub pend">+${fmt(s.pending)} al terminar</div>`:''}${s.last?`<div class="bub${isW?' w':''}">${esc(s.last)}</div>`:s.sitOut?'<div class="bub">Ausente</div>':s.stack===0&&!s.inHand?'<div class="bub">Sin fichas</div>':''}${tag}
    </div>`;

  }else if(s.stack===0&&!inH(s))extra='<p class="muted center">Te quedaste sin fichas.</p>';
  return `<section class="mypanel">

  if(key&&key!==lastTurnKey){

function rulesHtml(){
  const ex=(cs)=>`<span class="ex">${cs.split(' ').map(c=>cardH(c,'xs')).join('')}</span>`;
  return `<div class="modal"><div class="mbox"><header><h2>📖 Reglas del póker</h2><button class="btn sm ghost" data-a="closeRules">Cerrar</button></header>
  <div class="rules">
  <h3>Objetivo</h3><p>Ganar las fichas del bote: o tienes la mejor mano de 5 cartas al final (enfrentamiento), o todos los demás se retiran antes.</p>
  <h3>Ranking de manos (de mayor a menor)</h3>
  <ol class="rank">
    <li><b>Escalera real</b> ${ex('As Ks Qs Js Ts')}<small>A-K-Q-J-10 del mismo palo.</small></li>
    <li><b>Escalera de color</b> ${ex('9h 8h 7h 6h 5h')}<small>5 seguidas del mismo palo.</small></li>
    <li><b>Póker</b> ${ex('Qc Qd Qh Qs 4d')}<small>4 cartas iguales.</small></li>
    <li><b>Full</b> ${ex('Kc Kd Kh 7s 7d')}<small>Trío + par.</small></li>
    <li><b>Color</b> ${ex('Ad Jd 8d 5d 2d')}<small>5 del mismo palo.</small></li>
    <li><b>Escalera</b> ${ex('Tc 9d 8h 7s 6c')}<small>5 seguidas de cualquier palo. El As vale alto (A-K-Q-J-10) o bajo (5-4-3-2-A).</small></li>
    <li><b>Trío</b> ${ex('7c 7d 7h Kd 2s')}</li>
    <li><b>Doble par</b> ${ex('Jc Jd 4h 4s Ac')}</li>
    <li><b>Par</b> ${ex('Tc Td Ah 8s 3c')}</li>
    <li><b>Carta alta</b> ${ex('Ah Jd 9c 6s 3h')}</li>
  </ol>
  <p class="muted">Empates: se comparan las cartas más altas (la “patada”). Si las 5 cartas empatan, el bote se reparte. Los palos no tienen valor.</p>
  <h3>Cómo corre una mano</h3>
  <p>El botón <b>D</b> (repartidor) gira a la izquierda cada mano. Los dos siguientes ponen la <b>ciega pequeña (CP)</b> y la <b>ciega grande (CG)</b>. En tu turno puedes:</p>
  <ul><li><b>Retirarte:</b> tiras tus cartas y pierdes lo apostado.</li><li><b>Pasar:</b> si nadie ha apostado en esa ronda.</li><li><b>Igualar:</b> pones lo mismo que la apuesta más alta.</li><li><b>Apostar / Subir:</b> pones más; los demás deben igualar, subir o retirarse.</li><li><b>All-in:</b> apuestas todas tus fichas.</li></ul>
  <p>La ronda termina cuando todos los que siguen igualaron la apuesta mayor.</p>
  <h3>Juegos</h3>
  <p><b>Texas Hold'em:</b> 2 cartas tuyas. Rondas de apuestas: antes del flop, <b>flop</b> (3 cartas comunitarias), <b>turn</b> (4ª) y <b>river</b> (5ª). Haces tu mejor mano con cualquier combinación de 5 de las 7.</p>
  <p><b>Omaha:</b> igual que Hold'em pero con 4 cartas tuyas, y debes usar <b>exactamente 2</b> de tu mano y 3 de la mesa.</p>
  <p><b>Short Deck (6+):</b> Hold'em con baraja de 36 cartas (sin 2, 3, 4 ni 5). El <b>color le gana al full</b> y A-6-7-8-9 es escalera.</p>
  <p><b>Póker cerrado:</b> 5 cartas tapadas. Una ronda de apuestas, luego cada quien cambia de 0 a 5 cartas, y otra ronda de apuestas.</p>
  <p><b>Stud de 7 cartas:</b> sin ciegas; todos ponen <b>ante</b>. Recibes 2 tapadas y 1 destapada; la carta destapada más baja abre obligatoriamente. Luego 3 cartas destapadas más (4ª, 5ª y 6ª calle) y una tapada (7ª), con apuestas en cada calle. Desde la 4ª calle abre quien muestra mejor juego.</p>
  <h3>Tipos de apuesta</h3>
  <ul><li><b>Sin límite (NL):</b> puedes apostar todas tus fichas en cualquier momento. La subida mínima es igual a la subida anterior (mínimo la ciega grande).</li>
  <li><b>Límite al bote (PL):</b> lo máximo que puedes subir es el tamaño del bote (contando lo que pagas para igualar).</li>
  <li><b>Límite fijo (FL):</b> apuestas de tamaño fijo: 1 ciega grande en las primeras rondas y 2 en las últimas; máximo 4 apuestas por ronda.</li></ul>
  <h3>All-in y botes secundarios</h3>
  <p>Si no tienes fichas para igualar, vas all-in con lo que tengas y sólo puedes ganar de cada rival lo mismo que tú pusiste. El resto forma un <b>bote secundario</b> entre los demás. La app calcula todo automáticamente.</p>
  <h3>Torneos</h3>
  <p>Todos pagan la misma entrada y empiezan con las mismas fichas. Las ciegas suben cada nivel (por tiempo). Quien se queda sin fichas queda eliminado (salvo en el periodo de recompras). Si hay varias mesas, la app mueve jugadores para equilibrarlas y las va juntando hasta la mesa final. Gana quien se queda con todas las fichas.</p>
  <h3>Fichas</h3>
  <p>En mesas normales puedes recargar tus fichas con <b>➕ Fichas</b> si la mesa permite recompras. El anfitrión o quien creó la mesa puede dar fichas a cualquiera desde <b>⚙️ Admin</b>. Si estás jugando una mano, las fichas se suman al terminarla.</p>
  <h3>En esta app</h3>
  <ul><li>Un club puede tener hasta ${MAX_TABLES} mesas al mismo tiempo, y puedes sentarte en varias; arriba aparecen tus mesas y se marca ⏰ donde te toca.</li>
  <li>Si se acaba tu tiempo de turno: pasas si puedes, si no te retiras. Dos veces seguidas te marcan como ausente.</li>
  <li>Las cartas de los demás no llegan a tu celular hasta el enfrentamiento.</li>
  <li>Si quien abrió el club cambia de app, el juego se pausa y sigue al regresar; todos se reconectan solos. Para que nunca se pause, abre el club en una compu o tablet en “modo mesa”.</li>
  <li>Se juega con fichas, sin dinero real.</li></ul>
  </div></div></div>`;

  const saved=store.get('pk_host');
  if(q&&saved&&saved.C&&saved.C.code===q.toUpperCase()&&Date.now()-saved.at<12*3600e3)return hostClub(saved);
  if(q&&/^[A-Za-z0-9]{4}$/.test(q)){if(myName)return joinClub(q);renderHome();const ci=$('codeIn');if(ci)ci.value=q.toUpperCase();return}
  renderHome();
})();
